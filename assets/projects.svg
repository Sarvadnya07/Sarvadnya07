      <rect x="30" y="181" width="118" height="30" rx="8" fill="#111827" stroke="#334155"/><text x="89" y="201" text-anchor="middle" fill="#e2e8f0" font-size="12">FASTAPI</text>
      <rect x="158" y="181" width="118" height="30" rx="8" fill="#111827" stroke="#334155"/><text x="217" y="201" text-anchor="middle" fill="#e2e8f0" font-size="12">NEXT.JS</text>
