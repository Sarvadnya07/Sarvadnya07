      <text x="30" y="155" fill="#94a3b8" font-size="14">Community workflows, recommendations and scraping</text>
      <text x="30" y="182" fill="#94a3b8" font-size="14">API-driven platform with security-aware boundaries</text>
      <rect x="30" y="226" width="112" height="30" rx="8" fill="#111827" stroke="#334155"/><text x="86" y="246" text-anchor="middle" fill="#e2e8f0" font-size="12">FASTAPI</text>
      <rect x="152" y="226" width="112" height="30" rx="8" fill="#111827" stroke="#334155"/><text x="208" y="246" text-anchor="middle" fill="#e2e8f0" font-size="12">NEXT.JS</text>
    </g>

    <g transform="translate(938 398)">
      <rect width="410" height="302" rx="18" fill="#0b1220" stroke="#293548"/>
      <rect width="410" height="5" rx="2.5" fill="url(#line5)"/>
      <circle cx="42" cy="48" r="20" fill="#111a31" stroke="#60a5fa"/>
      <text x="78" y="55" fill="#f8fafc" font-size="25" font-weight="700">IdeaGPT</text>
      <text x="30" y="89" fill="#93c5fd" font-family="ui-monospace,monospace" font-size="13">AI TECHNICAL CO-FOUNDER</text>
      <text x="30" y="128" fill="#cbd5e1" font-size="15">Idea analysis → architecture → roadmap</text>
      <text x="30" y="155" fill="#94a3b8" font-size="14">Multi-provider orchestration with isolated workspaces</text>
      <text x="30" y="182" fill="#94a3b8" font-size="14">Technical feasibility and implementation planning</text>
      <rect x="30" y="226" width="112" height="30" rx="8" fill="#111827" stroke="#334155"/><text x="86" y="246" text-anchor="middle" fill="#e2e8f0" font-size="12">NEXT.JS</text>
      <rect x="152" y="226" width="112" height="30" rx="8" fill="#111827" stroke="#334155"/><text x="208" y="246" text-anchor="middle" fill="#e2e8f0" font-size="12">FASTAPI</text>
