      <text x="30" y="128" fill="#cbd5e1" font-size="15">EPUB / PDF with resilient annotations</text>
      <text x="30" y="155" fill="#94a3b8" font-size="14">Cryptographic annotation integrity across reflow</text>
      <text x="30" y="182" fill="#94a3b8" font-size="14">Rust core · SQLite WAL · FTS5 · typed IPC</text>
      <rect x="30" y="226" width="112" height="30" rx="8" fill="#111827" stroke="#334155"/><text x="86" y="246" text-anchor="middle" fill="#e2e8f0" font-size="12">RUST</text>
      <rect x="152" y="226" width="112" height="30" rx="8" fill="#111827" stroke="#334155"/><text x="208" y="246" text-anchor="middle" fill="#e2e8f0" font-size="12">TAURI</text>
    </g>

    <g transform="translate(495 398)">
      <rect width="410" height="302" rx="18" fill="#0b1220" stroke="#293548"/>
