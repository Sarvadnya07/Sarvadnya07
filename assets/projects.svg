<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Five flagship engineering projects</title>
  <desc id="desc">Professional project overview for Sherly AI, ZeroPhish, Luma, HackTrack and IdeaGPT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ef4444"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="line3" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#06b6d4"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <linearGradient id="line4" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f97316"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="line5" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>

  <rect width="1400" height="760" rx="26" fill="url(#bg)"/>
  <text x="64" y="62" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">FLAGSHIP ENGINEERING PROJECTS</text>
