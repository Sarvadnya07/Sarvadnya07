      <text x="30" y="89" fill="#a5b4fc" font-family="ui-monospace,monospace" font-size="13">LOCAL DEVELOPER ORCHESTRATOR</text>
      <text x="30" y="126" fill="#cbd5e1" font-size="15">Voice/text intent → policy checks → guarded execution</text>
      <text x="30" y="151" fill="#94a3b8" font-size="14">Diagnostics, patch previews, rollback and local model routing</text>
      <rect x="30" y="181" width="118" height="30" rx="8" fill="#111827" stroke="#334155"/><text x="89" y="201" text-anchor="middle" fill="#e2e8f0" font-size="12">PYTHON</text>
      <rect x="158" y="181" width="118" height="30" rx="8" fill="#111827" stroke="#334155"/><text x="217" y="201" text-anchor="middle" fill="#e2e8f0" font-size="12">FASTAPI</text>
      <rect x="286" y="181" width="118" height="30" rx="8" fill="#111827" stroke="#334155"/><text x="345" y="201" text-anchor="middle" fill="#e2e8f0" font-size="12">OLLAMA</text>
