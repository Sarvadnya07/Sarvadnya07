      <text x="30" y="89" fill="#fdba74" font-family="ui-monospace,monospace" font-size="13">AI-POWERED PHISHING DETECTION</text>
      <text x="30" y="126" fill="#cbd5e1" font-size="15">Chrome MV3 → heuristics → metadata / ML → Gemini</text>
