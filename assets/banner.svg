<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Sarvadnya Sonkambale — AI Engineer</title>
  <desc id="desc">Dark engineering portfolio hero with a clearer high-contrast systems illustration and Indian tricolor accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.55" stop-color="#0a101c"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.60" stop-color="#ff9a3d"/>
      <stop offset="0.82" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#39d353"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9933"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26344a"/>
      <stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff9df" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffe9a3" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0.56"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="28" fill="url(#grid)"/>
  <ellipse cx="1250" cy="110" rx="360" ry="170" fill="#2563eb" opacity="0.12" filter="url(#blur)"/>
  <ellipse cx="1370" cy="420" rx="320" ry="150" fill="#7c3aed" opacity="0.09" filter="url(#blur)"/>

  <rect x="58" y="42" width="1484" height="476" rx="22" fill="none" stroke="#334155" stroke-opacity="0.7"/>
  <rect x="58" y="42" width="1484" height="4" rx="2" fill="url(#tri)"/>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="104" y="90" fill="#94a3b8" font-size="18">&gt; engineer@sarvadnya:~$</text>
    <rect x="350" y="71" width="11" height="23" rx="2" fill="#34d399"/>
  </g>

  <text x="104" y="178" fill="url(#name)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800">Sarvadnya Sonkambale</text>
  <text x="106" y="226" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="23" letter-spacing="1.4">AI ENGINEER  •  FULL-STACK DEVELOPER  •  BUILDER</text>
  <text x="106" y="270" fill="#a9b6c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Building practical AI systems across LLM infrastructure, secure automation,</text>
  <text x="106" y="300" fill="#a9b6c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">backend engineering, local AI, and developer tooling.</text>

  <g transform="translate(106 338)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g><rect width="150" height="42" rx="10" fill="#111827" stroke="#334155"/><text x="75" y="27" text-anchor="middle" fill="#c4b5fd" font-size="15">AI / LLM</text></g>
    <g transform="translate(164)"><rect width="154" height="42" rx="10" fill="#111827" stroke="#334155"/><text x="77" y="27" text-anchor="middle" fill="#93c5fd" font-size="15">FULL STACK</text></g>
    <g transform="translate(332)"><rect width="140" height="42" rx="10" fill="#111827" stroke="#334155"/><text x="70" y="27" text-anchor="middle" fill="#86efac" font-size="15">SECURITY</text></g>
    <g transform="translate(486)"><rect width="164" height="42" rx="10" fill="#111827" stroke="#334155"/><text x="82" y="27" text-anchor="middle" fill="#e2e8f0" font-size="15">OPEN SOURCE</text></g>
  </g>

  <g transform="translate(106 406)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="0" y="24" fill="#94a3b8" font-size="14">BUILD</text>
    <text x="74" y="24" fill="#94a3b8" font-size="14">LEARN</text>
    <text x="153" y="24" fill="#94a3b8" font-size="14">IMPROVE</text>
    <text x="244" y="24" fill="#94a3b8" font-size="14">REPEAT</text>
    <rect x="0" y="42" width="310" height="1" fill="#263244"/>
    <rect x="0" y="48" width="74" height="3" rx="1.5" fill="#ff9933"/>
    <rect x="74" y="48" width="76" height="3" rx="1.5" fill="#f8fafc"/>
    <rect x="150" y="48" width="78" height="3" rx="1.5" fill="#138808"/>
  </g>

  <!-- clearer right-side visual panel -->
  <rect x="930" y="70" width="570" height="410" rx="28" fill="#07101c" fill-opacity="0.48" stroke="#26374e" stroke-width="2"/>
  <rect x="950" y="88" width="530" height="4" rx="2" fill="url(#tri)" opacity="0.95"/>

  <g transform="translate(960 108)">
    <text x="0" y="24" fill="#ffb36b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" letter-spacing="2">BUILD  /  LEARN  /  IMPROVE  /  REPEAT</text>

    <path d="M0 270 C62 218 108 238 162 180 C224 112 274 160 322 114 C372 68 412 118 470 72 C510 96 538 120 560 126 L560 350 L0 350 Z" fill="#0d1827" opacity="0.96"/>
    <path d="M0 300 L88 236 L144 282 L214 184 L278 278 L356 210 L428 286 L500 220 L560 260 L560 350 L0 350 Z" fill="url(#mountain)"/>

    <circle cx="360" cy="132" r="70" fill="#fef3c7" opacity="0.18" filter="url(#glow)"/>
    <circle cx="360" cy="132" r="61" fill="url(#sun)"/>

    <path d="M18 102 C138 42 258 44 372 72 C442 89 495 108 548 96" fill="none" stroke="#ff9933" stroke-width="15" stroke-linecap="round"/>
    <path d="M18 122 C140 62 262 64 375 88 C440 102 498 120 551 113" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <path d="M20 139 C146 82 270 84 380 105 C445 118 502 133 554 127" fill="none" stroke="#138808" stroke-width="15" stroke-linecap="round"/>

    <path d="M360 193 L360 128" stroke="#0b1220" stroke-width="4"/>
    <path d="M360 128 h50 l-16 25 h-34 z" fill="#08101a"/>
    <path d="M298 350 L360 244 L422 350 Z" fill="#020617"/>
    <path d="M331 350 L360 299 L389 350 Z" fill="#182338"/>
    <circle cx="360" cy="302" r="6" fill="#e2e8f0"/>

    <g transform="translate(18 292)">
      <text x="0" y="20" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">DISCIPLINE</text>
      <text x="0" y="43" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">SYSTEMS</text>
      <text x="0" y="66" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">BETTER TOOLS</text>
      <text x="0" y="89" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">BRIGHTER INDIA</text>
      <rect x="0" y="104" width="28" height="4" fill="#ff9933"/>
      <rect x="28" y="104" width="28" height="4" fill="#f8fafc"/>
      <rect x="56" y="104" width="28" height="4" fill="#138808"/>
    </g>

    <g transform="translate(315 286)">
      <rect width="225" height="66" rx="14" fill="#07101c" stroke="#31435b"/>
      <rect x="18" y="16" width="3" height="34" rx="1.5" fill="#60a5fa"/>
      <text x="34" y="29" fill="#f1f5f9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">Better tools.</text>
      <text x="34" y="49" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">A more capable tomorrow.</text>
    </g>
  </g>

  <text x="1088" y="508" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing="1.6">ARCHITECTURE  /  SECURITY  /  SYSTEMS  /  RELIABILITY</text>
</svg>