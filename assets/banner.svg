  <g transform="translate(980 108)" fill="none">
    <path d="M0 140 C120 95 210 95 340 40 C420 6 500 8 590 0" stroke="#ff9933" stroke-width="18" stroke-linecap="round" opacity="0.72"/>
    <path d="M0 152 C120 108 215 110 345 55 C425 22 505 24 600 16" stroke="#f5f7fa" stroke-width="11" stroke-linecap="round" opacity="0.66"/>
    <path d="M0 164 C120 120 220 123 350 70 C430 39 512 42 608 34" stroke="#138808" stroke-width="8" stroke-linecap="round" opacity="0.74"/>

    <path d="M35 255 L145 180 L205 228 L305 135 L395 210 L470 158 L590 255 Z" fill="#0a1220" stroke="#334155" stroke-width="2"/>
    <path d="M35 255 L145 180 L205 228 L305 135 L395 210 L470 158 L590 255" stroke="#64748b" stroke-width="2" opacity="0.8"/>

    <circle cx="410" cy="104" r="52" fill="#fde68a" opacity="0.92"/>
    <circle cx="410" cy="104" r="34" fill="#fff7d6" opacity="0.85"/>
    <path d="M410 136 V211 M410 153 L445 140" stroke="#f8fafc" stroke-width="3"/>
    <path d="M410 136 L410 101 L446 113 L410 126 Z" fill="#111827"/>

