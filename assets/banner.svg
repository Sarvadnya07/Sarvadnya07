    <rect x="150" y="48" width="78" height="3" rx="1.5" fill="#138808"/>
  </g>

  <g transform="translate(1020 74)">
    <path d="M0 300 C100 225 148 245 220 166 C284 96 347 152 398 108 C456 58 500 108 580 36 C655 82 695 94 748 124 L748 420 L0 420 Z" fill="#0b1220" opacity="0.9"/>
    <path d="M0 338 L150 226 L235 292 L346 156 L430 272 L540 204 L616 282 L724 196 L800 260 L800 420 L0 420 Z" fill="url(#mountain)"/>
    <circle cx="500" cy="115" r="74" fill="url(#sun)" opacity="0.95"/>
    <path d="M80 92 C250 16 408 20 570 68 C658 94 714 112 800 92" fill="none" stroke="#ff9933" stroke-width="18" stroke-linecap="round" opacity="0.82"/>
    <path d="M86 110 C250 34 420 42 575 83 C660 106 720 124 802 104" fill="none" stroke="#f8fafc" stroke-width="15" stroke-linecap="round" opacity="0.78"/>
    <path d="M92 128 C258 60 430 66 582 100 C666 120 730 137 806 118" fill="none" stroke="#138808" stroke-width="18" stroke-linecap="round" opacity="0.78"/>
    <path d="M500 194 L500 113" stroke="#0f172a" stroke-width="4"/>
    <path d="M500 112 h56 l-18 28 h-38 z" fill="#0b1220"/>
    <path d="M430 352 L500 246 L570 352 Z" fill="#020617"/>
    <path d="M465 352 L500 292 L535 352 Z" fill="#111827"/>
    <circle cx="500" cy="302" r="7" fill="#e2e8f0"/>
