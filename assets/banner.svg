      <text x="14" y="43" fill="#cbd5e1" font-size="11" font-family="ui-monospace,monospace">SYSTEMS</text>
      <text x="14" y="61" fill="#cbd5e1" font-size="11" font-family="ui-monospace,monospace">BUILD · VERIFY</text>
