<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Sarvadnya Sonkambale — AI Engineer</title>
  <desc id="desc">Dark engineering portfolio hero with high-contrast AI systems messaging, mountain illustration and Indian tricolor accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="55%" stop-color="#09111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#ff9a3d"/>
      <stop offset="0.82" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#39d353"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334766"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff9df" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffe9a3" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="28" fill="url(#grid)"/>
  <ellipse cx="1260" cy="120" rx="330" ry="160" fill="#2563eb" opacity="0.12" filter="url(#blur)"/>
  <ellipse cx="1420" cy="440" rx="260" ry="120" fill="#7c3aed" opacity="0.08" filter="url(#blur)"/>

  <rect x="52" y="38" width="1496" height="484" rx="22" fill="none" stroke="#334155" stroke-opacity="0.75"/>
  <rect x="52" y="38" width="1496" height="4" rx="2" fill="url(#tri)"/>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="92" y="84" fill="#b6c2d1" font-size="17">&gt; engineer@sarvadnya:~$</text>
    <rect x="337" y="66" width="10" height="22" rx="2" fill="#34d399"/>
  </g>

  <text x="92" y="168" fill="url(#name)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="60" font-weight="800">Sarvadnya Sonkambale</text>
  <text x="94" y="214" fill="#f1f5f9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" letter-spacing="1.1">AI ENGINEER  •  FULL-STACK DEVELOPER  •  BUILDER</text>
  <text x="94" y="258" fill="#d2dbe7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Building practical AI systems across LLM infrastructure, secure automation,</text>
  <text x="94" y="286" fill="#d2dbe7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">backend engineering, local AI, and developer tooling.</text>

  <g transform="translate(94 322)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g><rect width="146" height="40" rx="10" fill="#101827" stroke="#3b4b63"/><text x="73" y="26" text-anchor="middle" fill="#d8b4fe" font-size="14">AI / LLM</text></g>
    <g transform="translate(158)"><rect width="150" height="40" rx="10" fill="#101827" stroke="#3b4b63"/><text x="75" y="26" text-anchor="middle" fill="#b7d7ff" font-size="14">FULL STACK</text></g>
    <g transform="translate(320)"><rect width="136" height="40" rx="10" fill="#101827" stroke="#3b4b63"/><text x="68" y="26" text-anchor="middle" fill="#a7f3c2" font-size="14">SECURITY</text></g>
    <g transform="translate(468)"><rect width="160" height="40" rx="10" fill="#101827" stroke="#3b4b63"/><text x="80" y="26" text-anchor="middle" fill="#f1f5f9" font-size="14">OPEN SOURCE</text></g>
  </g>

  <g transform="translate(94 392)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="0" y="22" fill="#a9b6c8" font-size="13">BUILD</text>
    <text x="72" y="22" fill="#a9b6c8" font-size="13">LEARN</text>
    <text x="151" y="22" fill="#a9b6c8" font-size="13">IMPROVE</text>
    <text x="244" y="22" fill="#a9b6c8" font-size="13">REPEAT</text>
    <rect x="0" y="38" width="308" height="1" fill="#2b394d"/>
    <rect x="0" y="44" width="74" height="3" rx="1.5" fill="#ff9933"/>
    <rect x="74" y="44" width="76" height="3" rx="1.5" fill="#f8fafc"/>
    <rect x="150" y="44" width="78" height="3" rx="1.5" fill="#138808"/>
  </g>

  <!-- Right-side visual -->
  <g transform="translate(900 58)">
    <rect x="0" y="0" width="600" height="426" rx="26" fill="#08111e" fill-opacity="0.34" stroke="#29405d" stroke-width="2"/>
    <rect x="24" y="20" width="552" height="4" rx="2" fill="url(#tri)"/>

    <text x="34" y="58" fill="#ffd19f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing="1.8">BUILD / LEARN / IMPROVE / REPEAT</text>

    <path d="M18 320 C80 256 132 272 188 208 C250 132 318 184 372 132 C428 78 486 128 560 64 L582 350 L18 350 Z" fill="#17253a"/>
    <path d="M18 342 L118 258 L186 302 L266 188 L336 292 L414 222 L482 300 L548 230 L582 266 L582 350 L18 350 Z" fill="url(#mountain)"/>

    <circle cx="400" cy="130" r="88" fill="#fef3c7" opacity="0.14" filter="url(#blur)"/>
    <circle cx="400" cy="130" r="65" fill="url(#sun)"/>

    <path d="M18 92 C158 26 290 30 408 62 C478 80 528 102 570 96" fill="none" stroke="#ff9933" stroke-width="15" stroke-linecap="round"/>
    <path d="M18 112 C158 48 292 52 412 76 C482 92 532 116 572 108" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <path d="M18 130 C160 68 296 72 416 94 C486 108 534 130 574 120" fill="none" stroke="#138808" stroke-width="15" stroke-linecap="round"/>

    <path d="M400 200 L400 126" stroke="#08101a" stroke-width="4"/>
    <path d="M400 126 h54 l-16 26 h-38 z" fill="#08101a"/>
    <path d="M338 350 L400 246 L462 350 Z" fill="#020617"/>
    <path d="M368 350 L400 296 L432 350 Z" fill="#1b2a41"/>
    <circle cx="400" cy="304" r="6" fill="#e2e8f0"/>

    <g transform="translate(34 228)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
      <text x="0" y="20" fill="#f1f5f9" font-size="15">DISCIPLINE</text>
      <text x="0" y="42" fill="#cbd5e1" font-size="15">SYSTEMS</text>
      <text x="0" y="64" fill="#cbd5e1" font-size="15">BETTER TOOLS</text>
      <text x="0" y="86" fill="#cbd5e1" font-size="15">BRIGHTER INDIA</text>
      <rect x="0" y="100" width="26" height="4" fill="#ff9933"/>
      <rect x="26" y="100" width="26" height="4" fill="#f8fafc"/>
      <rect x="52" y="100" width="26" height="4" fill="#138808"/>
    </g>

    <g transform="translate(292 280)">
      <rect width="270" height="70" rx="14" fill="#06101c" fill-opacity="0.96" stroke="#40536c"/>
      <rect x="17" y="15" width="3" height="38" rx="1.5" fill="#60a5fa"/>
      <text x="34" y="31" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">Better tools.</text>
      <text x="34" y="52" fill="#d3dce8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">A more capable tomorrow.</text>
    </g>
  </g>

  <text x="900" y="512" fill="#9bacbf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1.55">ARCHITECTURE  /  SECURITY  /  SYSTEMS  /  RELIABILITY</text>
</svg>