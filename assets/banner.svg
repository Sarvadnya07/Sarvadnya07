  <rect x="115" y="356" width="630" height="2" rx="1" fill="url(#tri)" opacity="0.85"/>
  <text x="115" y="383" fill="#64748b" font-size="14" font-family="ui-monospace,monospace">BUILD THE SYSTEM  /  UNDERSTAND THE SYSTEM  /  VERIFY THE SYSTEM</text>
