<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Sarvadnya Sonkambale — AI Engineer</title>
  <desc id="desc">Clean dark engineering hero banner with restrained India-inspired tricolor accents and systems motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="58%" stop-color="#0d1422"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1600" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="460" rx="28" fill="url(#grid)"/>
  <ellipse cx="1360" cy="110" rx="260" ry="125" fill="#2563eb" opacity="0.10" filter="url(#soft)"/>
  <ellipse cx="1490" cy="360" rx="230" ry="120" fill="#22c55e" opacity="0.07" filter="url(#soft)"/>

  <rect x="70" y="70" width="1460" height="320" rx="24" fill="#0b1220" fill-opacity="0.34" stroke="#334155" stroke-opacity="0.65"/>
  <rect x="70" y="70" width="7" height="320" rx="3.5" fill="url(#tri)"/>

  <g transform="translate(115 112)">
    <text x="0" y="0" fill="#7dd3fc" font-size="18" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">&gt; engineer@sarvadnya:~$</text>
    <circle cx="278" cy="-6" r="8" fill="#22c55e" opacity="0.9"/>

    <text x="0" y="78" fill="#f8fafc" font-size="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="750">Sarvadnya</text>
    <text x="315" y="78" fill="url(#tri)" font-size="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="750">Sonkambale</text>

    <text x="0" y="125" fill="#cbd5e1" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">AI ENGINEER  ·  SYSTEMS BUILDER  ·  FULL-STACK DEVELOPER</text>
    <text x="0" y="166" fill="#94a3b8" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif">AI/LLM systems • secure automation • backend engineering • developer tooling</text>

