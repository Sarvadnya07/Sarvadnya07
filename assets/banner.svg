  <text x="1070" y="508" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing="1.8">ARCHITECTURE  /  SECURITY  /  SYSTEMS  /  RELIABILITY</text>
