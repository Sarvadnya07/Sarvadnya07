<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Sarvadnya Sonkambale — AI Engineer</title>
  <desc id="desc">High-contrast dark engineering portfolio hero with terminal styling, AI systems messaging, Indian tricolor accents and a clear mountain illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04070d"/><stop offset="52%" stop-color="#09111f"/><stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="0.58" stop-color="#ff9a3d"/><stop offset="0.82" stop-color="#ffffff"/><stop offset="1" stop-color="#39d353"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9933"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#138808"/></linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#31435f"/><stop offset="1" stop-color="#04070d"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff9df"/><stop offset="0.72" stop-color="#ffe9a3"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0.72"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
  </defs>

  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="28" fill="url(#grid)"/>
  <rect x="52" y="38" width="1496" height="484" rx="22" fill="none" stroke="#334155" stroke-opacity="0.78"/>
  <rect x="52" y="38" width="1496" height="4" rx="2" fill="url(#tri)"/>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="92" y="84" fill="#c0cad8" font-size="17">&gt; engineer@sarvadnya:~$</text>
    <rect x="337" y="66" width="10" height="22" rx="2" fill="#34d399"/>
  </g>

  <text x="92" y="168" fill="url(#name)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="60" font-weight="800">Sarvadnya Sonkambale</text>
  <text x="94" y="214" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" letter-spacing="1.1">AI ENGINEER  •  FULL-STACK DEVELOPER  •  BUILDER</text>
  <text x="94" y="258" fill="#d7e0eb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Building practical AI systems across LLM infrastructure, secure automation,</text>
  <text x="94" y="286" fill="#d7e0eb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">backend engineering, local AI, and developer tooling.</text>

  <g transform="translate(94 322)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g><rect width="146" height="40" rx="10" fill="#101827" stroke="#40536d"/><text x="73" y="26" text-anchor="middle" fill="#d8b4fe" font-size="14">AI / LLM</text></g>
    <g transform="translate(158)"><rect width="150" height="40" rx="10" fill="#101827" stroke="#40536d"/><text x="75" y="26" text-anchor="middle" fill="#b7d7ff" font-size="14">FULL STACK</text></g>
    <g transform="translate(320)"><rect width="136" height="40" rx="10" fill="#101827" stroke="#40536d"/><text x="68" y="26" text-anchor="middle" fill="#a7f3c2" font-size="14">SECURITY</text></g>
    <g transform="translate(468)"><rect width="160" height="40" rx="10" fill="#101827" stroke="#40536d"/><text x="80" y="26" text-anchor="middle" fill="#f1f5f9" font-size="14">OPEN SOURCE</text></g>
  </g>

  <g transform="translate(94 392)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="0" y="22" fill="#a9b6c8" font-size="13">BUILD</text><text x="72" y="22" fill="#a9b6c8" font-size="13">LEARN</text><text x="151" y="22" fill="#a9b6c8" font-size="13">IMPROVE</text><text x="244" y="22" fill="#a9b6c8" font-size="13">REPEAT</text>
    <rect x="0" y="38" width="308" height="1" fill="#2b394d"/><rect x="0" y="44" width="74" height="3" rx="1.5" fill="#ff9933"/><rect x="74" y="44" width="76" height="3" rx="1.5" fill="#f8fafc"/><rect x="150" y="44" width="78" height="3" rx="1.5" fill="#138808"/>
  </g>

  <!-- Dedicated right visual panel: kept fully inside the hero bounds for clear GitHub rendering -->
  <rect x="862" y="64" width="642" height="424" rx="26" fill="#06101b" fill-opacity="0.92" stroke="#2f4763" stroke-width="2"/>
  <rect x="884" y="84" width="598" height="4" rx="2" fill="url(#tri)"/>
  <text x="894" y="116" fill="#ffd19f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing="1.8">BUILD / LEARN / IMPROVE / REPEAT</text>

  <g transform="translate(892 122)">
    <path d="M0 246 C65 192 112 218 174 150 C232 86 298 136 352 92 C410 44 462 94 534 30 L594 94 L594 304 L0 304 Z" fill="#17253a"/>
    <path d="M0 286 L98 210 L162 252 L246 142 L318 258 L402 176 L470 266 L540 190 L594 242 L594 304 L0 304 Z" fill="url(#mountain)"/>

    <circle cx="414" cy="118" r="92" fill="#fff1b5" opacity="0.18" filter="url(#glow)"/>
    <circle cx="414" cy="118" r="64" fill="url(#sun)"/>

    <path d="M36 92 C168 28 292 34 414 64 C488 82 540 101 588 95" fill="none" stroke="#ff9933" stroke-width="15" stroke-linecap="round"/>
    <path d="M36 112 C170 50 298 56 418 80 C490 95 542 114 590 108" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
    <path d="M36 130 C172 72 302 78 422 98 C494 111 544 128 592 121" fill="none" stroke="#138808" stroke-width="15" stroke-linecap="round"/>

    <path d="M414 184 L414 116" stroke="#08101a" stroke-width="4"/><path d="M414 116 h52 l-16 25 h-36 z" fill="#08101a"/>
    <path d="M350 304 L414 198 L478 304 Z" fill="#020617"/><path d="M380 304 L414 248 L448 304 Z" fill="#1b2a41"/><circle cx="414" cy="258" r="6" fill="#f1f5f9"/>

    <g transform="translate(26 190)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
      <text x="0" y="18" fill="#f8fafc" font-size="15">DISCIPLINE</text><text x="0" y="40" fill="#d7e0eb" font-size="15">SYSTEMS</text><text x="0" y="62" fill="#d7e0eb" font-size="15">BETTER TOOLS</text><text x="0" y="84" fill="#d7e0eb" font-size="15">BRIGHTER INDIA</text>
      <rect x="0" y="98" width="26" height="4" fill="#ff9933"/><rect x="26" y="98" width="26" height="4" fill="#ffffff"/><rect x="52" y="98" width="26" height="4" fill="#138808"/>
    </g>

    <g transform="translate(292 230)">
      <rect width="278" height="68" rx="14" fill="#040c15" stroke="#50647d"/>
      <rect x="16" y="14" width="3" height="38" rx="1.5" fill="#60a5fa"/>
      <text x="32" y="29" fill="#ffffff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">Better tools.</text>
      <text x="32" y="50" fill="#dce5ef" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">A more capable tomorrow.</text>
    </g>
  </g>

  <text x="902" y="512" fill="#a7b5c8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1.5">ARCHITECTURE  /  SECURITY  /  SYSTEMS  /  RELIABILITY</text>
</svg>