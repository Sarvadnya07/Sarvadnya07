    <text x="74" y="24" fill="#64748b" font-size="14">LEARN</text>
    <text x="153" y="24" fill="#64748b" font-size="14">IMPROVE</text>
    <text x="244" y="24" fill="#64748b" font-size="14">REPEAT</text>
