<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 380" role="img" aria-labelledby="title desc">
  <title id="title">AI systems engineering banner</title>
  <desc id="desc">Minimal dark engineering banner highlighting AI systems, secure automation, backend engineering and developer tooling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="55%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1600" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="380" rx="28" fill="url(#grid)"/>
  <ellipse cx="1370" cy="90" rx="250" ry="110" fill="#2563eb" opacity="0.12" filter="url(#soft)"/>
  <ellipse cx="1480" cy="310" rx="220" ry="90" fill="#7c3aed" opacity="0.10" filter="url(#soft)"/>

  <rect x="76" y="62" width="250" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="76" y="105" fill="#94a3b8" font-size="15" letter-spacing="2.6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    AI SYSTEMS  /  SECURE AUTOMATION  /  DEVELOPER TOOLING
  </text>

  <text x="76" y="170" fill="#f8fafc" font-size="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">
    BUILDING PRACTICAL AI SYSTEMS
  </text>

  <text x="76" y="213" fill="#cbd5e1" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif">
    LLM infrastructure · backend engineering · local AI · full-stack products
  </text>

  <g transform="translate(76 266)">
    <rect x="0" y="0" width="170" height="42" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="85" y="27" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">PYTHON · TS</text>
    <rect x="184" y="0" width="170" height="42" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="269" y="27" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">RUST · DART</text>
    <rect x="368" y="0" width="190" height="42" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="463" y="27" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">FASTAPI · NEXT.JS</text>
  </g>

  <g transform="translate(1050 72)" fill="none">
    <path d="M80 120L190 58L300 120L408 72" stroke="#334155" stroke-width="2"/>
    <path d="M80 120L190 182L300 120L408 170" stroke="#334155" stroke-width="2"/>
    <path d="M190 58L190 182M300 120L408 72M300 120L408 170" stroke="#334155" stroke-width="2"/>

    <circle cx="80" cy="120" r="24" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <circle cx="190" cy="58" r="24" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="190" cy="182" r="24" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="300" cy="120" r="28" fill="#0f172a" stroke="url(#node)" stroke-width="3"/>
    <circle cx="408" cy="72" r="20" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="408" cy="170" r="20" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>

    <path d="M290 120h20M300 110v20" stroke="#f8fafc" stroke-width="2.5"/>
    <path d="M70 120h20M80 110v20" stroke="#f8fafc" stroke-width="2"/>
    <path d="M181 49l18 18M199 49l-18 18" stroke="#f8fafc" stroke-width="2"/>
  </g>

  <rect x="76" y="336" width="1448" height="1" fill="#1e293b"/>
  <circle cx="76" cy="336" r="3" fill="#ff9933"/>
  <circle cx="800" cy="336" r="3" fill="#e5e7eb"/>
  <circle cx="1524" cy="336" r="3" fill="#138808"/>
</svg>