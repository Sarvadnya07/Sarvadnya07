      <rect x="0" y="0" width="132" height="38" rx="10" fill="#111827" stroke="#334155"/>
      <text x="66" y="25" text-anchor="middle" fill="#dbeafe" font-size="14" font-family="ui-monospace,monospace">AI / LLM</text>
      <rect x="143" y="0" width="132" height="38" rx="10" fill="#111827" stroke="#334155"/>
      <text x="209" y="25" text-anchor="middle" fill="#dbeafe" font-size="14" font-family="ui-monospace,monospace">FULL STACK</text>
      <rect x="286" y="0" width="132" height="38" rx="10" fill="#111827" stroke="#334155"/>
      <text x="352" y="25" text-anchor="middle" fill="#bbf7d0" font-size="14" font-family="ui-monospace,monospace">SECURITY</text>
      <rect x="429" y="0" width="132" height="38" rx="10" fill="#111827" stroke="#334155"/>
      <text x="495" y="25" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="ui-monospace,monospace">SYSTEMS</text>
    </g>
