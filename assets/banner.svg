  <g transform="translate(1110 410)">
    <rect width="380" height="66" rx="14" fill="#08101b" stroke="#334155"/>
    <rect x="18" y="17" width="4" height="32" rx="2" fill="#60a5fa"/>
    <text x="38" y="29" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">Better tools.</text>
    <text x="38" y="50" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">A more capable tomorrow.</text>
    <text x="308" y="28" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">INDIA</text>
    <text x="308" y="46" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">BUILDS</text>
    <rect x="308" y="55" width="20" height="3" fill="#ff9933"/>
    <rect x="328" y="55" width="20" height="3" fill="#f8fafc"/>
    <rect x="348" y="55" width="20" height="3" fill="#138808"/>
