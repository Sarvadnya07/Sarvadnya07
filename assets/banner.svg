<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Sarvadnya Sonkambale — AI Engineer</title>
  <desc id="desc">Dark engineering portfolio hero with terminal styling, AI systems messaging and subtle Indian tricolor accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.58" stop-color="#0a101c"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#f97316"/>
      <stop offset="0.78" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9933"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#060a11"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0.68"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="28" fill="url(#grid)"/>
  <ellipse cx="1290" cy="120" rx="310" ry="150" fill="#2563eb" opacity="0.12" filter="url(#blur)"/>
  <ellipse cx="1470" cy="430" rx="280" ry="130" fill="#7c3aed" opacity="0.10" filter="url(#blur)"/>

  <rect x="58" y="42" width="1484" height="476" rx="22" fill="none" stroke="#334155" stroke-opacity="0.7"/>
  <rect x="58" y="42" width="1484" height="4" rx="2" fill="url(#tri)"/>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="104" y="90" fill="#94a3b8" font-size="18">&gt; engineer@sarvadnya:~$</text>
    <rect x="350" y="71" width="11" height="23" rx="2" fill="#34d399"/>
  </g>

  <text x="104" y="178" fill="url(#name)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800">Sarvadnya Sonkambale</text>
  <text x="106" y="226" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="23" letter-spacing="1.4">AI ENGINEER  •  FULL-STACK DEVELOPER  •  BUILDER</text>
  <text x="106" y="270" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Building practical AI systems across LLM infrastructure, secure automation,</text>
  <text x="106" y="300" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">backend engineering, local AI, and developer tooling.</text>

  <g transform="translate(106 338)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g>
      <rect width="150" height="42" rx="10" fill="#111827" stroke="#334155"/>
      <text x="75" y="27" text-anchor="middle" fill="#c4b5fd" font-size="15">AI / LLM</text>
    </g>
    <g transform="translate(164)">
      <rect width="154" height="42" rx="10" fill="#111827" stroke="#334155"/>
      <text x="77" y="27" text-anchor="middle" fill="#93c5fd" font-size="15">FULL STACK</text>
    </g>
    <g transform="translate(332)">
      <rect width="140" height="42" rx="10" fill="#111827" stroke="#334155"/>
      <text x="70" y="27" text-anchor="middle" fill="#86efac" font-size="15">SECURITY</text>
    </g>
    <g transform="translate(486)">
