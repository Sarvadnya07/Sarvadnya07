<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">ZeroPhish animated demo</title><desc id="desc">Animated phishing detection dashboard showing URL intake, layered analysis, threat verdict and live telemetry.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b12"/><stop offset="1" stop-color="#1a1010"/></linearGradient>
 <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22c55e"/><stop offset=".55" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="700" rx="28" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="632" rx="22" fill="#0a0f18" stroke="#303746"/>
<text x="70" y="82" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">ZeroPhish</text>
<text x="70" y="111" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="16">AI-powered phishing detection · live analysis</text>
<rect x="70" y="145" width="1060" height="72" rx="13" fill="#111827" stroke="#374151"/>
<text x="92" y="190" fill="#64748b" font-family="ui-monospace,monospace" font-size="16">URL</text>
<text x="142" y="191" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="20">https://secure-account.example/login</text>
<g font-family="ui-monospace,monospace">
 <text x="70" y="263" fill="#fca5a5" font-size="15">LAYERED ANALYSIS</text>
 <rect x="70" y="282" width="240" height="76" rx="13" fill="#111827" stroke="#334155"/>
 <text x="92" y="315" fill="#e2e8f0" font-size="17">1 · HEURISTICS</text><text x="92" y="341" fill="#4ade80" font-size="14">completed</text>
 <rect x="330" y="282" width="240" height="76" rx="13" fill="#111827" stroke="#334155"/>
 <text x="352" y="315" fill="#e2e8f0" font-size="17">2 · ML MODEL</text><text x="352" y="341" fill="#fbbf24" font-size="14">scanning…</text>
 <rect x="590" y="282" width="240" height="76" rx="13" fill="#111827" stroke="#334155"/>
 <text x="612" y="315" fill="#e2e8f0" font-size="17">3 · GEMINI</text><text x="612" y="341" fill="#60a5fa" font-size="14">queued</text>
 <rect x="850" y="282" width="280" height="76" rx="13" fill="#111827" stroke="#334155"/>
 <text x="872" y="315" fill="#e2e8f0" font-size="17">THREAT INTEL</text><text x="872" y="341" fill="#a78bfa" font-size="14">WHOIS · redirects</text>
</g>
<rect x="70" y="392" width="1060" height="24" rx="12" fill="#111827" stroke="#2c3442"/>
<rect x="72" y="394" width="530" height="20" rx="10" fill="url(#risk)">
 <animate attributeName="width" values="260;820;530" dur="3.5s" repeatCount="indefinite"/>
</rect>
<circle cx="603" cy="404" r="13" fill="#ef4444" filter="url(#glow)">
 <animate attributeName="cx" values="350;900;603" dur="3.5s" repeatCount="indefinite"/>
</circle>
<g transform="translate(70 470)">
 <rect width="1060" height="145" rx="16" fill="#0d1420" stroke="#3f2020"/>
 <text x="24" y="40" fill="#fca5a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">VERDICT</text>
 <text x="24" y="79" fill="#ef4444" font-family="ui-monospace,monospace" font-size="31" font-weight="700">HIGH RISK · PHISHING SUSPECTED</text>
 <text x="24" y="113" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="15">typosquatting · suspicious redirect chain · credential-harvest pattern</text>
 <circle cx="1010" cy="72" r="30" fill="#321518" stroke="#ef4444"><animate attributeName="r" values="26;34;26" dur="1.7s" repeatCount="indefinite"/></circle>
 <path d="M1010 55v24M1010 87v3" stroke="#fecaca" stroke-width="4" stroke-linecap="round"/>
</g>
<text x="70" y="646" fill="#64748b" font-family="ui-monospace,monospace" font-size="14">LIVE TELEMETRY  ·  Redis acceleration  ·  SSE stream  ·  Chrome MV3</text>
</svg>